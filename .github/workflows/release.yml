name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (patch = fixes, minor = compatible improvements, major = breaking changes)
        required: true
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Require the master branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Run the Release workflow from master."
            exit 1
          fi

      - name: Validate source
        run: |
          npm run check
          npm test

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, and tag
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          CURRENT_TAG="v${CURRENT_VERSION}"
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "${CURRENT_TAG}^{commit}" 2>/dev/null || true)"
          SUBJECT="$(git log -1 --format=%s)"

          # Resume safely if a prior run pushed the release commit/tag but failed
          # before creating the GitHub Release.
          if [ "${TAG_SHA}" = "${HEAD_SHA}" ] && ! gh release view "${CURRENT_TAG}" >/dev/null 2>&1; then
            VERSION="${CURRENT_VERSION}"
            TAG="${CURRENT_TAG}"
            echo "Resuming incomplete release ${TAG}"
          elif [ "${SUBJECT}" = "chore(release): ${CURRENT_TAG}" ] && [ -z "${TAG_SHA}" ]; then
            VERSION="${CURRENT_VERSION}"
            TAG="${CURRENT_TAG}"
            git tag -a "${TAG}" -m "${TAG}"
            git push origin "refs/tags/${TAG}"
            echo "Completed missing tag for ${TAG}"
          else
            VERSION="$(BUMP="${BUMP}" node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(pkg.version)
          if (!match) throw new Error(`package.json version must be stable MAJOR.MINOR.PATCH; got ${pkg.version}`)

          let [major, minor, patch] = match.slice(1).map(Number)
          switch (process.env.BUMP) {
            case 'major': major += 1; minor = 0; patch = 0; break
            case 'minor': minor += 1; patch = 0; break
            case 'patch': patch += 1; break
            default: throw new Error(`Unsupported version increment: ${process.env.BUMP}`)
          }

          pkg.version = `${major}.${minor}.${patch}`
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          process.stdout.write(pkg.version)
          NODE
          )"
            TAG="v${VERSION}"

            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists. Refusing to overwrite it."
              exit 1
            fi

            npm run check
            npm test

            git add package.json
            git commit -m "chore(release): ${TAG}"
            git tag -a "${TAG}" -m "${TAG}"
            git push origin HEAD:refs/heads/master "refs/tags/${TAG}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Package release tarball
        id: pack
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          test -s "${TARBALL}"
          echo "file=${TARBALL}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release and attach package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.pack.outputs.file }}" \
            --verify-tag \
            --title "dsh-rustxng-web-search ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Write release summary
        run: |
          {
            echo "## GitHub release published"
            echo
            echo "- Version: ` ${{ steps.version.outputs.version }} `"
            echo "- Tag: ` ${{ steps.version.outputs.tag }} `"
            echo "- Asset: ` ${{ steps.pack.outputs.file }} `"
            echo
            echo "This workflow publishes the GitHub Release asset. npm registry publishing remains a separate, manually approved step."
          } >> "${GITHUB_STEP_SUMMARY}"
