# Adds key-free web search backed by a local RustXNG metasearch server.
# The engine binary is fetched from upstream RustXNG releases into bin/, never
# committed and never published by this bundle.
# This bundle layer is the top profile layer, so these overrides win over
# the built-in defaults shipped with dsh.

# 1. Insert the plugin that registers the "rustxng" search provider.
- insert:
    - id: rustxng-web-search
      name: 'dsh-rustxng-web-search'
      config: {}

# 2. Make the DSH web capability always select our local search provider.
#    `config` on the web row is replaced WHOLESALE, not merged: the web row owns
#    exactly `searchProvider` and `fetchProvider`, so both must be restated.
#    `fetchProvider: http` keeps the shipped base default; leaving it out would
#    leave fetch auto-selected and fail with WEB_PROVIDER_AMBIGUOUS once both
#    `deepseek-fetch-api` and `http` are registered.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: rustxng
    fetchProvider: http

# 3. Guarantee the model-facing web tools (web_search / web_fetch) are enabled
#    by default, even in profiles that ship them off.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: false
